<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Courier New', ui-monospace, monospace" role="img" aria-label="Contributing to Liffy — branch, commit, gate, review">
<defs>
<style>
  /* Same keyframes, same names, same delay ladder as assets/header.svg, so
     the two headers read as one hand. Anything new here would show. */
  .px   { opacity: 0; }
  .scan { opacity: 0; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes dot    { 0%,60% { opacity: 1 } 70%,100% { opacity: .15 } }
  @keyframes pulse  { 0%,100% { opacity: 0 } 8% { opacity: .9 } 34% { opacity: .12 } 62% { opacity: 0 } }
  @keyframes scan   { 0% { transform: translateY(0); opacity: 0 } 12% { opacity: .10 } 88% { opacity: .10 } 100% { transform: translateY(224px); opacity: 0 } }
  @media (prefers-reduced-motion: no-preference) {
    .boot { opacity: 0; transform-box: fill-box; animation: fadein .6s ease forwards; }
    .d1 { animation-delay: .10s } .d2 { animation-delay: .30s } .d3 { animation-delay: .50s } .d4 { animation-delay: .70s }
    .d5 { animation-delay: 1.0s } .d6 { animation-delay: 1.25s } .d7 { animation-delay: 1.5s } .d8 { animation-delay: 1.75s }
    .cursor { animation: blink 1s steps(1) infinite; }
    .odot   { animation: dot 1.8s ease-in-out infinite; }
    .px     { animation: pulse 3.4s ease-in-out infinite; }
    .scan   { animation: scan 4.8s linear infinite; }
  }
</style>
</defs>
<rect x="4" y="4" width="872" height="292" rx="18" fill="#ededed" stroke="#111111" stroke-width="4"/>
<g stroke="#e6e6e6" stroke-width="1">
<line x1="40" y1="20" x2="40" y2="280"/>
<line x1="80" y1="20" x2="80" y2="280"/>
<line x1="120" y1="20" x2="120" y2="280"/>
<line x1="160" y1="20" x2="160" y2="280"/>
<line x1="200" y1="20" x2="200" y2="280"/>
<line x1="240" y1="20" x2="240" y2="280"/>
<line x1="280" y1="20" x2="280" y2="280"/>
<line x1="320" y1="20" x2="320" y2="280"/>
<line x1="360" y1="20" x2="360" y2="280"/>
<line x1="400" y1="20" x2="400" y2="280"/>
<line x1="440" y1="20" x2="440" y2="280"/>
<line x1="480" y1="20" x2="480" y2="280"/>
<line x1="520" y1="20" x2="520" y2="280"/>
<line x1="560" y1="20" x2="560" y2="280"/>
<line x1="600" y1="20" x2="600" y2="280"/>
<line x1="640" y1="20" x2="640" y2="280"/>
<line x1="680" y1="20" x2="680" y2="280"/>
<line x1="720" y1="20" x2="720" y2="280"/>
<line x1="760" y1="20" x2="760" y2="280"/>
<line x1="800" y1="20" x2="800" y2="280"/>
<line x1="840" y1="20" x2="840" y2="280"/>
<line x1="20" y1="40" x2="860" y2="40"/>
<line x1="20" y1="80" x2="860" y2="80"/>
<line x1="20" y1="120" x2="860" y2="120"/>
<line x1="20" y1="160" x2="860" y2="160"/>
<line x1="20" y1="200" x2="860" y2="200"/>
<line x1="20" y1="240" x2="860" y2="240"/>
</g>
<path d="M 42 26 L 26 26 L 26 42" fill="none" stroke="#111111" stroke-width="3"/>
<path d="M 838 26 L 854 26 L 854 42" fill="none" stroke="#111111" stroke-width="3"/>
<path d="M 42 274 L 26 274 L 26 258" fill="none" stroke="#111111" stroke-width="3"/>
<path d="M 838 274 L 854 274 L 854 258" fill="none" stroke="#111111" stroke-width="3"/>
<text x="46" y="50" font-size="12" letter-spacing="3" fill="#8f8f8f">// LIFFY &#183; CONTRIBUTING</text>
<circle class="odot" cx="700" cy="46" r="5" fill="#111111"/>
<text x="714" y="50" font-size="12" letter-spacing="3" fill="#8f8f8f">OPEN TO PRS</text>
<text class="boot d1" x="58" y="112" font-size="46" font-weight="700" letter-spacing="1" fill="#111111">Contributing</text>
<text class="boot d2" x="61" y="140" font-size="14" letter-spacing=".5" fill="#555555">a student project built in the open. bug reports especially &#8212; there are two of us.</text>
<g class="boot d3">
<text x="60" y="170" font-size="14" letter-spacing="1" fill="#8f8f8f">&#62; git checkout -b feat/github-webhook</text>
<rect class="cursor" x="412" y="159" width="8" height="14" fill="#111111"/>
</g>
<!-- the workflow, four beats, arriving left to right -->
<g class="boot d4">
<rect x="58" y="186" width="170" height="76" rx="6" fill="#f6f6f6" stroke="#111111" stroke-width="2"/>
<text x="70" y="208" font-size="10" letter-spacing="2" fill="#8f8f8f">01 &#183; BRANCH</text>
<text x="70" y="230" font-size="12" letter-spacing=".5" fill="#111111">feat/&#8230;  fix/&#8230;</text>
<text x="70" y="248" font-size="12" letter-spacing=".5" fill="#111111">chore/&#8230;  docs/&#8230;</text>
</g>
<line x1="234" y1="224" x2="250" y2="224" stroke="#8f8f8f" stroke-width="1.5" stroke-dasharray="2 3"/>
<g class="boot d5">
<rect x="256" y="186" width="170" height="76" rx="6" fill="#f6f6f6" stroke="#111111" stroke-width="2"/>
<text x="268" y="208" font-size="10" letter-spacing="2" fill="#8f8f8f">02 &#183; COMMIT</text>
<text x="268" y="230" font-size="12" letter-spacing=".5" fill="#111111">feat: add github</text>
<text x="268" y="248" font-size="12" letter-spacing=".5" fill="#111111">webhook endpoint</text>
<rect class="cursor" x="394" y="238" width="7" height="12" fill="#111111"/>
</g>
<line x1="432" y1="224" x2="448" y2="224" stroke="#8f8f8f" stroke-width="1.5" stroke-dasharray="2 3"/>
<g class="boot d6">
<rect x="454" y="186" width="170" height="76" rx="6" fill="#f6f6f6" stroke="#111111" stroke-width="2"/>
<text x="466" y="208" font-size="10" letter-spacing="2" fill="#8f8f8f">03 &#183; GATE</text>
<text x="466" y="230" font-size="12" letter-spacing=".5" fill="#111111">pytest <tspan fill="#456646">&#10003;</tspan>  lint <tspan fill="#456646">&#10003;</tspan></text>
<text x="466" y="248" font-size="12" letter-spacing=".5" fill="#111111">types <tspan fill="#456646">&#10003;</tspan>  build <tspan fill="#456646">&#10003;</tspan></text>
</g>
<line x1="630" y1="224" x2="646" y2="224" stroke="#8f8f8f" stroke-width="1.5" stroke-dasharray="2 3"/>
<!-- the payoff card, inverted the way the verdict stamp is on the front page -->
<g class="boot d7">
<rect x="652" y="186" width="170" height="76" rx="6" fill="#111111"/>
<text x="664" y="208" font-size="10" letter-spacing="2" fill="#8f8f8f">04 &#183; REVIEW</text>
<text x="664" y="230" font-size="12" letter-spacing=".5" fill="#ededed">1 approval min</text>
<text x="664" y="248" font-size="12" letter-spacing=".5" fill="#ededed">CI green</text>
<rect class="px" x="796" y="238" width="9" height="9" rx="2" fill="#ededed" style="animation-delay:1.6s"/>
</g>
<text x="58" y="286" font-size="10" letter-spacing="1" fill="#8f8f8f">~ $ gh pr create &#183; say what changed, why, and how to test it</text>
<rect class="scan" x="26" y="40" width="828" height="2" fill="#111111"/>
</svg>
