<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Courier New', ui-monospace, monospace" role="img" aria-label="Liffy — AI-powered peer code review, self-hosted">
<defs>
<style>
  .px   { opacity: 0; }
  .scan { opacity: 0; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes dot    { 0%,60% { opacity: 1 } 70%,100% { opacity: .15 } }
  @keyframes pulse  { 0%,100% { opacity: 0 } 8% { opacity: .9 } 34% { opacity: .12 } 62% { opacity: 0 } }
  @keyframes scan   { 0% { transform: translateY(0); opacity: 0 } 12% { opacity: .10 } 88% { opacity: .10 } 100% { transform: translateY(224px); opacity: 0 } }
  @keyframes sweep  { 0% { transform: translateY(0); opacity: 0 } 10% { opacity: .14 } 90% { opacity: .14 } 100% { transform: translateY(150px); opacity: 0 } }
  @media (prefers-reduced-motion: no-preference) {
    .boot { opacity: 0; transform-box: fill-box; animation: fadein .6s ease forwards; }
    .d1 { animation-delay: .10s } .d2 { animation-delay: .30s } .d3 { animation-delay: .50s } .d4 { animation-delay: .70s }
    .d5 { animation-delay: 1.0s } .d6 { animation-delay: 1.25s } .d7 { animation-delay: 1.5s } .d8 { animation-delay: 1.75s }
    .stamp { opacity: 0; transform-box: fill-box; animation: fadein .5s ease 2.3s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .odot   { animation: dot 1.8s ease-in-out infinite; }
    .px     { animation: pulse 3.4s ease-in-out infinite; }
    .scan   { animation: scan 4.8s linear infinite; }
    .sweep  { animation: sweep 3.2s linear infinite; }
  }
</style>
</defs>
<rect x="4" y="4" width="872" height="292" rx="18" fill="#ededed" stroke="#111111" stroke-width="4"/>
<g stroke="#e6e6e6" stroke-width="1">
<line x1="40" y1="20" x2="40" y2="280"/>
<line x1="80" y1="20" x2="80" y2="280"/>
<line x1="120" y1="20" x2="120" y2="280"/>
<line x1="160" y1="20" x2="160" y2="280"/>
<line x1="200" y1="20" x2="200" y2="280"/>
<line x1="240" y1="20" x2="240" y2="280"/>
<line x1="280" y1="20" x2="280" y2="280"/>
<line x1="320" y1="20" x2="320" y2="280"/>
<line x1="360" y1="20" x2="360" y2="280"/>
<line x1="400" y1="20" x2="400" y2="280"/>
<line x1="440" y1="20" x2="440" y2="280"/>
<line x1="480" y1="20" x2="480" y2="280"/>
<line x1="520" y1="20" x2="520" y2="280"/>
<line x1="560" y1="20" x2="560" y2="280"/>
<line x1="600" y1="20" x2="600" y2="280"/>
<line x1="640" y1="20" x2="640" y2="280"/>
<line x1="680" y1="20" x2="680" y2="280"/>
<line x1="720" y1="20" x2="720" y2="280"/>
<line x1="760" y1="20" x2="760" y2="280"/>
<line x1="800" y1="20" x2="800" y2="280"/>
<line x1="840" y1="20" x2="840" y2="280"/>
<line x1="20" y1="40" x2="860" y2="40"/>
<line x1="20" y1="80" x2="860" y2="80"/>
<line x1="20" y1="120" x2="860" y2="120"/>
<line x1="20" y1="160" x2="860" y2="160"/>
<line x1="20" y1="200" x2="860" y2="200"/>
<line x1="20" y1="240" x2="860" y2="240"/>
</g>
<path d="M 42 26 L 26 26 L 26 42" fill="none" stroke="#111111" stroke-width="3"/>
<path d="M 838 26 L 854 26 L 854 42" fill="none" stroke="#111111" stroke-width="3"/>
<path d="M 42 274 L 26 274 L 26 258" fill="none" stroke="#111111" stroke-width="3"/>
<path d="M 838 274 L 854 274 L 854 258" fill="none" stroke="#111111" stroke-width="3"/>
<text x="46" y="50" font-size="12" letter-spacing="3" fill="#8f8f8f">// LIFFY &#183; AI CODE REVIEW</text>
<circle class="odot" cx="726" cy="46" r="5" fill="#111111"/>
<text x="740" y="50" font-size="12" letter-spacing="3" fill="#8f8f8f">REVIEWING</text>
<text class="boot d1" x="60" y="102" font-size="15" letter-spacing="1" fill="#8f8f8f">&#62; liffy review --pr 42</text>
<text class="boot d1" x="58" y="156" font-size="58" font-weight="700" letter-spacing="1" fill="#111111">Liffy</text>
<text class="boot d2" x="61" y="190" font-size="21" font-weight="700" letter-spacing="1" fill="#111111">@lucenity0/Liffy</text>
<text class="boot d2" x="298" y="190" font-size="13" letter-spacing="1" fill="#8f8f8f">self-hosted</text>
<g class="boot d3">
<text x="62" y="220" font-size="15" letter-spacing=".5" fill="#555555">your AI senior engineer. reads every diff.</text>
<rect class="cursor" x="446" y="208" width="9" height="15" fill="#111111"/>
</g>
<g class="boot d4">
<rect x="60" y="242" width="44" height="24" rx="3" fill="none" stroke="#111111" stroke-width="1.5"/>
<text x="82" y="258" font-size="11" letter-spacing="2" fill="#111111" text-anchor="middle">RAG</text>
</g>
<g class="boot d4">
<rect x="116" y="242" width="46" height="24" rx="3" fill="none" stroke="#111111" stroke-width="1.5"/>
<text x="139" y="258" font-size="11" letter-spacing="2" fill="#111111" text-anchor="middle">LLM</text>
</g>
<g class="boot d4">
<rect x="174" y="242" width="92" height="24" rx="3" fill="none" stroke="#111111" stroke-width="1.5"/>
<text x="220" y="258" font-size="11" letter-spacing="2" fill="#111111" text-anchor="middle">BYO KEYS</text>
</g>
<!-- pull-request diff panel -->
<text x="560" y="76" font-size="10" letter-spacing="2" fill="#8f8f8f">// PULL REQUEST #42</text>
<rect x="560" y="86" width="280" height="150" rx="6" fill="#f6f6f6" stroke="#111111" stroke-width="2"/>
<line x1="560" y1="110" x2="840" y2="110" stroke="#dcdcdc" stroke-width="1.5"/>
<text x="572" y="102" font-size="10" letter-spacing="1" fill="#8f8f8f">src/auth/session.py</text>
<!-- diff rows: + solid, - hollow, context light -->
<g class="boot d5" font-size="11">
<text x="572" y="130" fill="#8f8f8f">&#160;</text>
<rect x="586" y="121" width="150" height="9" rx="2" fill="#dcdcdc"/>
</g>
<g class="boot d5" font-size="11">
<text x="572" y="146" fill="#111111">-</text>
<rect x="586" y="137" width="120" height="9" rx="2" fill="none" stroke="#8f8f8f" stroke-width="1.2" stroke-dasharray="3 3"/>
</g>
<g class="boot d6" font-size="11">
<text x="572" y="162" fill="#111111">+</text>
<rect x="586" y="153" width="176" height="9" rx="2" fill="#111111"/>
</g>
<g class="boot d6" font-size="11">
<text x="572" y="178" fill="#111111">+</text>
<rect x="586" y="169" width="132" height="9" rx="2" fill="#111111"/>
</g>
<g class="boot d7" font-size="11">
<text x="572" y="194" fill="#8f8f8f">&#160;</text>
<rect x="586" y="185" width="104" height="9" rx="2" fill="#dcdcdc"/>
</g>
<g class="boot d7" font-size="11">
<text x="572" y="210" fill="#111111">+</text>
<rect x="586" y="201" width="158" height="9" rx="2" fill="#6f6f6f"/>
</g>
<!-- liffy's comment markers, pulsing on the changed lines -->
<rect class="px" x="772" y="153" width="9" height="9" rx="2" fill="#111111" style="animation-delay:0.4s"/>
<rect class="px" x="728" y="169" width="9" height="9" rx="2" fill="#111111" style="animation-delay:1.2s"/>
<rect class="px" x="754" y="201" width="9" height="9" rx="2" fill="#111111" style="animation-delay:2.0s"/>
<!-- the review sweep inside the panel -->
<rect class="sweep" x="562" y="88" width="276" height="3" fill="#111111"/>
<!-- verdict stamp -->
<g class="stamp">
<rect x="672" y="244" width="168" height="26" rx="4" fill="#ededed" stroke="#111111" stroke-width="2" transform="rotate(-2 756 257)"/>
<text x="756" y="261" font-size="12" font-weight="700" letter-spacing="2" fill="#111111" text-anchor="middle" transform="rotate(-2 756 257)">LGTM &#10003; MERGE IT</text>
</g>
<text x="560" y="290" font-size="10" letter-spacing="1" fill="#8f8f8f">~ $ git push &#183; liffy reads the rest</text>
<rect class="scan" x="26" y="40" width="828" height="2" fill="#111111"/>
</svg>
