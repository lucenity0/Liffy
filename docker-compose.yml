# Local development stack for Liffy (report §11).
# Brings up: FastAPI API, Celery worker, PostgreSQL, Redis, ChromaDB.
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liffy
      POSTGRES_PASSWORD: liffy
      POSTGRES_DB: liffy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liffy -d liffy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.18
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"          # host 8001 -> container 8000 (backend keeps 8000)
    volumes:
      - chromadata:/chroma/chroma

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://liffy:liffy@postgres:5432/liffy
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      GITHUB_WEBHOOK_SECRET: change-me
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-16000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "8000:8000"
    # command comes from the backend Dockerfile CMD (uvicorn)

  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://liffy:liffy@postgres:5432/liffy
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # No OAuth vars here: the worker never runs the handshake nor verifies a
      # JWT. It reaches GitHub with the PAT, and with per-user tokens read from
      # the database once AUTH-5 lands.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-16000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Only the worker posts reviews — the `api` service never does, so these
      # are deliberately absent from its env block. Both default off/safe.
      POST_REVIEWS_TO_GITHUB: ${POST_REVIEWS_TO_GITHUB:-False}
      GITHUB_REVIEW_EVENT_MODE: ${GITHUB_REVIEW_EVENT_MODE:-comment_only}
    command: celery -A app.workers.celery_app worker --loglevel=info

  # The scheduler for the weekly eval_scores job (report §8.2). It only decides
  # *when* to enqueue; the `worker` above is what actually runs the task.
  #
  # ⚠ EXACTLY ONE. Do not scale this service — two schedulers means every
  # scheduled task fires twice, and for an upsert job that shows up as
  # duplicated work rather than as an error.
  #
  # No Chroma dependency: beat touches neither the vector store nor an LLM. It
  # needs Redis to enqueue and Postgres only because the app's settings and
  # models import at startup.
  beat:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://liffy:liffy@postgres:5432/liffy
      REDIS_URL: redis://redis:6379/0
    # `celerybeat-schedule`, the scheduler's state file, is already gitignored.
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  pgdata:
  chromadata:
