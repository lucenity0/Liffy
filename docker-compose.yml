# Local development stack for Liffy (report §11).
# Brings up: FastAPI API, Celery worker, PostgreSQL, Redis, ChromaDB.
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liffy
      POSTGRES_PASSWORD: liffy
      POSTGRES_DB: liffy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liffy -d liffy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.18
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"          # host 8001 -> container 8000 (backend keeps 8000)
    volumes:
      - chromadata:/chroma/chroma

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    # The README says `cp .env.example backend/.env`, and this is the line that
    # makes Compose actually read it — ${VAR} interpolation only ever expands
    # from the *root* .env, so the documented setup produced a container with
    # no credentials at all and an OAuth redirect carrying `client_id=`, which
    # GitHub answers with a 404 on an unknown app.
    # `required: false` keeps a fresh clone starting before any .env exists.
    env_file:
      - path: ./backend/.env
        required: false
    # Only what has to differ *because* this is a container. Everything else
    # this block used to restate — provider, model, token budget, embedding
    # settings, the empty credential defaults — is already declared with the
    # same default in app/config.py, and repeating it here did real damage:
    # `environment:` outranks `env_file:`, so `${GITHUB_CLIENT_ID:-}` resolved
    # to an empty string that overwrote the value in backend/.env.
    environment:
      DATABASE_URL: postgresql://liffy:liffy@postgres:5432/liffy
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # The embedding model is ~65 MB and fastembed caches it under
      # /tmp/fastembed_cache, which is the container's writable layer: every
      # rebuild threw it away and re-downloaded. Pointed at a named volume so
      # it is fetched once and survives `up --build`.
      FASTEMBED_CACHE_PATH: /models
      # Hugging Face's Xet CAS backend returned a 500 mid-download on that
      # model, and because the fetch happens inside the task, indexing and
      # every queued review failed with an opaque "File reconstruction error"
      # rather than anything naming the model. This falls back to the classic
      # download path, which is slower and does not go through that CDN.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - modelcache:/models
    ports:
      - "8000:8000"
    # command comes from the backend Dockerfile CMD (uvicorn)

  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same reason as the backend: without this the worker starts with no
    # ANTHROPIC_API_KEY and no GITHUB_TOKEN, and every queued review dies on
    # the first call out.
    env_file:
      - path: ./backend/.env
        required: false
    # The OAuth vars are no longer *absent* from this process — env_file is
    # all-or-nothing and Compose has no per-key filter. The property that
    # mattered still holds, and it was always a property of the code rather
    # than of this block: the worker runs no handshake and verifies no JWT, so
    # it never reads them. It reaches GitHub with the PAT, and with per-user
    # tokens read from the database once AUTH-5 lands.
    environment:
      DATABASE_URL: postgresql://liffy:liffy@postgres:5432/liffy
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # The embedding model is ~65 MB and fastembed caches it under
      # /tmp/fastembed_cache, which is the container's writable layer: every
      # rebuild threw it away and re-downloaded. Pointed at a named volume so
      # it is fetched once and survives `up --build`.
      FASTEMBED_CACHE_PATH: /models
      # Hugging Face's Xet CAS backend returned a 500 mid-download on that
      # model, and because the fetch happens inside the task, indexing and
      # every queued review failed with an opaque "File reconstruction error"
      # rather than anything naming the model. This falls back to the classic
      # download path, which is slower and does not go through that CDN.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - modelcache:/models
    # POST_REVIEWS_TO_GITHUB and GITHUB_REVIEW_EVENT_MODE are not restated here
    # for the same reason as everything else above: both are declared with the
    # same default in app/config.py (False / "comment_only") and shipped in
    # .env.example, so env_file carries them. Restating them as
    # `${POST_REVIEWS_TO_GITHUB:-False}` would put an empty-string override
    # *above* backend/.env in Compose's precedence and silently pin posting off
    # for anyone who enabled it — the exact bug #228 fixed.
    #
    # Only the worker posts; the `api` service never calls the publisher. That
    # is a property of the code, not of this block, so `api` also reading these
    # via its own env_file is harmless.
    # ⚠ --concurrency is load-bearing, not tuning. Celery's prefork pool
    # defaults to one process per CPU, and every one of them loads its own copy
    # of the local embedding model (BAAI/bge-small-en-v1.5, plus onnxruntime).
    # On an 8-core host that is 8 models in memory: indexing a mid-sized
    # repository OOM-killed this container repeatedly, and because a killed
    # worker takes its in-flight task with it, the review or index that was
    # running simply vanished — no row, no error, nothing in the UI.
    #
    # Two is enough to keep a review moving while an index runs. Raise it only
    # alongside a memory limit you have actually measured.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # The scheduler for the weekly eval_scores job (report §8.2). It only decides
  # *when* to enqueue; the `worker` above is what actually runs the task.
  #
  # ⚠ EXACTLY ONE. Do not scale this service — two schedulers means every
  # scheduled task fires twice, and for an upsert job that shows up as
  # duplicated work rather than as an error.
  #
  # No Chroma dependency: beat touches neither the vector store nor an LLM. It
  # needs Redis to enqueue and Postgres only because the app's settings and
  # models import at startup.
  beat:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://liffy:liffy@postgres:5432/liffy
      REDIS_URL: redis://redis:6379/0
    # `celerybeat-schedule`, the scheduler's state file, is already gitignored.
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  pgdata:
  # Shared by backend and worker: both construct an embedder, and there is no
  # reason for them to hold separate copies of the same 65 MB of weights.
  modelcache:
  chromadata:
