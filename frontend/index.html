<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The default theme's --paper. The boot script below rewrites this as
         soon as it knows which theme is actually active. -->
    <meta name="theme-color" content="#12171a" />
    <meta
      name="description"
      content="Liffy — a self-hosted AI code reviewer for your pull requests."
    />

    <!-- Blocking on purpose. The theme has to be on <html> before the first
         paint, or the page renders in one palette and snaps to another — so
         this runs here rather than in the app, which mounts too late to help.

         This is the one place that cannot import src/lib/themes.ts: it has to
         execute before any module loads. THEMES below is therefore a
         duplicate, and a deliberate one — it needs only id -> polarity and
         id -> theme-colour, not the labels or notes. Adding a theme means
         adding it here, in src/lib/themes.ts, and as a [data-theme] block in
         src/index.css. The storage format is documented on ThemePrefs in
         src/hooks/useTheme.ts; this reader must stay compatible with it,
         including the bare "paper"/"graphite" strings older versions and the
         docs pages write.

         Wrapped in try/catch because localStorage throws outright when
         storage is partitioned or blocked, and a colour preference is not
         worth a blank page. -->
    <script>
      (function () {
        var THEMES = {
          paper: { polarity: "light", color: "#f0ece3" },
          bond: { polarity: "light", color: "#f2f2ef" },
          graphite: { polarity: "dark", color: "#1d1b18" },
          blackboard: { polarity: "dark", color: "#12171a" },
          carbon: { polarity: "dark", color: "#0b0b0b" },
        };
        var DEFAULT = "blackboard";

        var id = DEFAULT;
        var custom = null;
        try {
          var raw = localStorage.getItem("liffy-theme");
          if (raw) {
            if (THEMES[raw]) {
              // Bare string: what older versions and the docs pages write.
              id = raw;
            } else {
              var p = JSON.parse(raw);
              custom = p.custom || null;
              var pick =
                p.mode === "system"
                  ? window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? p.dark
                    : p.light
                  : p.theme;
              if (THEMES[pick]) id = pick;
              else if (pick === "custom" && custom) id = "custom";
            }
          }
        } catch (e) {
          /* The default it is. */
        }

        var root = document.documentElement;
        var polarity = THEMES[id] ? THEMES[id].polarity : "dark";
        var color = THEMES[id] ? THEMES[id].color : null;

        /* The custom palette has to be in the document before the attribute
           starts matching, or the first paint is an unstyled page. Its values
           live in storage rather than in index.css, so this writes the rule
           out here and the app's applyCustomTheme replaces the same element
           afterwards. It restates deriveTokens' output, not its logic — the
           tokens are stored already resolved.

           `html[data-theme]`, not `[data-theme]`: this <style> is appended
           while the parser is still above Vite's stylesheet <link>, so at
           (0,1,0) it tied with :root and *lost on source order* — the Paper
           palette won and every freshly loaded custom theme rendered light,
           in every tab except the one that had just saved it. Keep this
           selector in step with customThemeCss in src/lib/theme/derive.ts. */
        if (id === "custom" && custom) {
          polarity = custom.seeds.polarity === "light" ? "light" : "dark";
          color = custom.seeds.surface;
          var body = "";
          for (var key in custom.tokens) {
            if (Object.prototype.hasOwnProperty.call(custom.tokens, key)) {
              body += "--" + key + ":" + custom.tokens[key] + ";";
            }
          }
          var style = document.createElement("style");
          style.id = "liffy-custom-theme";
          style.textContent =
            'html[data-theme="custom"]{color-scheme:' +
            polarity +
            ";" +
            body +
            "}";
          document.head.appendChild(style);
        }

        root.setAttribute("data-theme", id);
        root.classList.add(polarity);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && color) meta.setAttribute("content", color);

        /* The workspace shape — UI scale, density, radius, weights, fonts.
           Same pre-paint reason as the palette, and a louder one: --ui-scale
           drives the type ramp *and* Tailwind's --spacing, so applying it a
           render late reflows every page on load rather than merely
           recolouring it.

           The rule body is read out of `liffy-appearance-css`, a cache that
           applyAppearance writes and nothing else reads — see the note on
           APPEARANCE_CSS_KEY in src/hooks/useAppearance.ts. So this script
           duplicates no mapping at all; it only has to know that the value
           is a stylesheet and where to put it. `html:root` inside outranks
           index.css's `:root` on specificity, so unlike the palette above it
           does not care where in <head> it lands.

           The three attributes are stored verbatim on the config, so they
           are copied rather than derived. Separate try/catch: a config that
           will not parse must not cost the page its palette, which is
           already applied by the time this runs. */
        try {
          var css = localStorage.getItem("liffy-appearance-css");
          if (css) {
            var uiStyle = document.createElement("style");
            uiStyle.id = "liffy-appearance";
            uiStyle.textContent = css;
            document.head.appendChild(uiStyle);
          }
          var cfg = JSON.parse(localStorage.getItem("liffy-appearance") || "{}");
          root.setAttribute("data-motion", cfg.motion || "full");
          root.setAttribute("data-shadow", cfg.shadow || "hard");
          root.setAttribute("data-nav", cfg.nav || "rail");
        } catch (e) {
          /* Defaults, which are what index.css already says. */
        }
      })();
    </script>

    <!-- The two faces above the fold: Neon sets the chrome, Argon sets the
         wordmark, every heading and all of Liffy's prose. `crossorigin` is
         required on font preloads even same-origin, or the browser fetches
         them twice.

         These are the only two faces that exist — styles/fonts.css declares
         Neon, Argon and the metric-matched local() fallback, and nothing
         else. This used to point at MonaspaceRadonVar.woff2, which is not in
         public/fonts: every load fired a 404 *and* left Argon unpreloaded, so
         the face carrying most of the page swapped in after first paint. -->
    <link
      rel="preload"
      href="/fonts/MonaspaceNeonVar.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/MonaspaceArgonVar.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Liffy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
