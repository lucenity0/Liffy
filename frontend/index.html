<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The default theme's --paper. The boot script below rewrites this as
         soon as it knows which theme is actually active. -->
    <meta name="theme-color" content="#1d1b18" />
    <meta
      name="description"
      content="Liffy — a self-hosted AI code reviewer for your pull requests."
    />

    <!-- Blocking on purpose. The theme has to be on <html> before the first
         paint, or the page renders in one palette and snaps to another — so
         this runs here rather than in the app, which mounts too late to help.

         This is the one place that cannot import src/lib/themes.ts: it has to
         execute before any module loads. THEMES below is therefore a
         duplicate, and a deliberate one — it needs only id -> polarity and
         id -> theme-colour, not the labels or notes. Adding a theme means
         adding it here, in src/lib/themes.ts, and as a [data-theme] block in
         src/index.css. The storage format is documented on ThemePrefs in
         src/hooks/useTheme.ts; this reader must stay compatible with it,
         including the bare "paper"/"graphite" strings older versions and the
         docs pages write.

         Wrapped in try/catch because localStorage throws outright when
         storage is partitioned or blocked, and a colour preference is not
         worth a blank page. -->
    <script>
      (function () {
        var THEMES = {
          paper: { polarity: "light", color: "#f0ece3" },
          graphite: { polarity: "dark", color: "#1d1b18" },
        };
        var DEFAULT = "graphite";

        var id = DEFAULT;
        try {
          var raw = localStorage.getItem("liffy-theme");
          if (raw) {
            if (THEMES[raw]) {
              // Bare string: what older versions and the docs pages write.
              id = raw;
            } else {
              var p = JSON.parse(raw);
              var pick =
                p.mode === "system"
                  ? window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? p.dark
                    : p.light
                  : p.theme;
              if (THEMES[pick]) id = pick;
            }
          }
        } catch (e) {
          /* The default it is. */
        }

        var root = document.documentElement;
        root.setAttribute("data-theme", id);
        root.classList.add(THEMES[id].polarity);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", THEMES[id].color);
      })();
    </script>

    <!-- The two faces above the fold: Neon sets the chrome, Argon sets the
         wordmark, every heading and all of Liffy's prose. `crossorigin` is
         required on font preloads even same-origin, or the browser fetches
         them twice.

         These are the only two faces that exist — styles/fonts.css declares
         Neon, Argon and the metric-matched local() fallback, and nothing
         else. This used to point at MonaspaceRadonVar.woff2, which is not in
         public/fonts: every load fired a 404 *and* left Argon unpreloaded, so
         the face carrying most of the page swapped in after first paint. -->
    <link
      rel="preload"
      href="/fonts/MonaspaceNeonVar.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/MonaspaceArgonVar.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Liffy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
