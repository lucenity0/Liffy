<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta
      name="description"
      content="Liffy — a self-hosted AI code reviewer for your pull requests."
    />

    <!-- The two faces above the fold. `crossorigin` is required on font
         preloads even same-origin, or the browser fetches them twice. -->
    <link
      rel="preload"
      href="/fonts/MonaspaceNeonVar.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/MonaspaceRadonVar.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Liffy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
